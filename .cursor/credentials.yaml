# EMU_v0 Global Credentials
# DO NOT COMMIT THIS FILE
# Add to .gitignore immediately

## Firebase Project
firebase:
  project_id: emu-incidents
  project_name: EMU-Alerts
  
  # Admin SDK Service Account (for backend/MCP)
  admin_sdk:
    file_path: ./firebase-admin-key.json
    type: service_account
    usage:
      - Firebase MCP (Cursor integration)
      - Node.js backend scripts
      - Server-side Firestore operations
      - Bypassing security rules (admin access)
    security: NEVER expose to client

  # Web App Config (client-side)
  web_config:
    api_key: ${NEXT_PUBLIC_FIREBASE_API_KEY}
    auth_domain: emu-incidents.firebaseapp.com
    project_id: emu-incidents
    storage_bucket: emu-incidents.appspot.com
    messaging_sender_id: "841200945180"
    app_id: ${NEXT_PUBLIC_FIREBASE_APP_ID_WEB}

  # Firebase Cloud Messaging
  fcm:
    vapid_key: ${NEXT_PUBLIC_FCM_VAPID_KEY}
    usage:
      - Browser push notifications
      - Foreground/background messages
      - User notification subscriptions
    security: Safe to expose (public key)

## Google Maps
google_maps:
  api_key: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
  usage:
    - Map rendering
    - Geocoding
    - Location display
  restrictions:
    - HTTP referrer: localhost:3000, *.4axe.com
    - APIs: Maps JavaScript API, Geocoding API

## GitHub
github:
  repository: ynotfins/EMU_v0
  url: https://github.com/ynotfins/EMU_v0
  branches:
    - main
  
  # GitHub Personal Access Token (for MCP)
  personal_access_token: ${GITHUB_PERSONAL_ACCESS_TOKEN}
  token_scopes:
    - repo
    - read:org
    - read:user
    - user:email

## Development
dev:
  fallback_uid: dev-user-0000001
  usage: Development authentication bypass
  
## Deployment
deployment:
  firebase_hosting:
    site: emu-incidents
    url: https://emu-incidents.web.app
  
  production_domain:
    planned: 4axe.com
    registrar: GoDaddy
    dns_provider: Cloudflare (planned)

## Environment Variables Reference
# Add these to .env.local (never commit):
env_vars:
  required:
    - NEXT_PUBLIC_FIREBASE_API_KEY
    - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    - NEXT_PUBLIC_FIREBASE_APP_ID_WEB
    - NEXT_PUBLIC_FCM_VAPID_KEY
    - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
  
  optional:
    - GITHUB_PERSONAL_ACCESS_TOKEN (for GitHub MCP)
    - EMU_SUPER_UID (for role seeding)
    - NEXT_PUBLIC_DEV_UID (development fallback)

## Security Notes
security_reminders:
  - "✅ firebase-admin-key.json is in .gitignore"
  - "✅ .env.local is in .gitignore"
  - "❌ NEVER commit API keys to Git"
  - "❌ NEVER expose Admin SDK key to client"
  - "✅ FCM VAPID key is safe to expose (public key)"
  - "✅ Use NEXT_PUBLIC_ prefix only for client-safe vars"

## Key Locations
key_files:
  firebase_admin_sdk: ./firebase-admin-key.json
  env_local: ./.env.local
  firestore_rules: ./firestore.rules
  firebase_config: ./firebase.json

## Access URLs
urls:
  firebase_console: https://console.firebase.google.com/project/emu-incidents
  firebase_admin_sdk: https://console.firebase.google.com/project/emu-incidents/settings/serviceaccounts/adminsdk
  firebase_cloud_messaging: https://console.firebase.google.com/project/emu-incidents/settings/cloudmessaging
  firestore_database: https://console.firebase.google.com/project/emu-incidents/firestore
  firebase_hosting: https://console.firebase.google.com/project/emu-incidents/hosting
  github_repo: https://github.com/ynotfins/EMU_v0
  github_tokens: https://github.com/settings/tokens

