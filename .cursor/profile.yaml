# EMU_v0 Global Project Profile

## Project Identity
project:
  name: EMU_v0
  full_name: Emergency Management Units - Alerts System
  version: 0.1.0
  status: Development
  started: 2025-10-28
  owner: ynotfins
  
## Project Description
description:
  short: Professional emergency alert management and response coordination platform
  long: |
    EMU Alerts connects emergency responders (chasers) with supervisors and emergency
    management units. Real-time incident tracking, favorites/bookmarks, chat
    communication, live location tracking, file sharing, and e-signatures.

## Technology Stack
stack:
  framework: Next.js 16.0.0
  runtime: Node.js
  language: TypeScript
  ui_library: React 19
  styling: Tailwind CSS + shadcn/ui
  database: Firebase Firestore
  auth: Firebase Authentication
  storage: Firebase Storage
  hosting: Firebase Hosting
  notifications: Firebase Cloud Messaging (FCM)
  maps: Google Maps JavaScript API
  build_tool: Turbopack
  package_manager: pnpm
  version_control: Git + GitHub

## Architecture
architecture:
  type: Next.js App Router (Server + Client Components)
  routing: File-based routing
  state_management: React Hooks + Context
  data_layer: Firebase SDK (real-time listeners)
  api_pattern: Server Actions + Client Hooks
  
  key_patterns:
    - Server components for page routing
    - Client components for interactivity
    - Real-time Firestore onSnapshot listeners
    - Local storage for user preferences
    - Role-based access control (Firestore rules)

## User Roles
roles:
  chaser:
    name: Emergency Responder
    routes: /chaser/*
    permissions:
      - View incidents
      - Favorite/bookmark incidents
      - Chat with supervisors
      - Share location
      - Upload files
      - Add notes
      - E-sign documents
  
  supe:
    name: Supervisor
    routes: /supe/*
    permissions:
      - All chaser permissions
      - View live map of all chasers
      - Create/edit incidents
      - Manage updates
      - Approve documents
  
  admin:
    name: Administrator
    routes: /admin/*
    permissions:
      - All supe permissions
      - Manage users
      - Configure system
      - Deploy Firestore rules

## Key Features
features:
  incidents:
    - Real-time incident feed
    - Filter by type, location, date
    - Favorites and bookmarks (per-user)
    - Notes (private to user)
    - Silence toggle (local storage)
    - Detail view with map, files, updates
  
  communication:
    - Thread-based chat (group + per-incident)
    - Real-time messaging
    - Push notifications (FCM)
    - Participant management
  
  location:
    - Live location tracking
    - Map view of active responders
    - Distance calculations
    - Geofencing (planned)
  
  files:
    - Document upload/download
    - Firebase Storage integration
    - File preview
    - Access control
  
  esign:
    - Homeowner information forms
    - Digital signatures
    - Document verification
    - Audit trail
  
  profile:
    - User settings (push, location)
    - Payout information (CashApp, Venmo, Zelle, PayPal)
    - Emergency contacts
    - Preferences

## Data Model
data:
  collections:
    incidents:
      fields:
        - id, incidentNumber, type, state, county, city, address
        - lat, lng, message, updatedAt, createdAt
        - favoritedBy[], bookmarkedBy[]
      subcollections:
        - updates, notes, files
    
    profiles:
      fields:
        - uid, displayName, email, phone, role, photoURL
        - settings (pushEnabled, locationEnabled)
        - payout (cashApp, venmo, zelle, paypal)
      security: Users can read/write own profile only
    
    threads:
      fields:
        - id, name, type (group/incident), participants[]
        - lastMessage, updatedAt
      subcollections:
        - messages (text, senderId, timestamp, read[])
    
    roles:
      documents:
        - supes/{uid}, admins/{uid}
      security: Used for Firestore rules role checks
    
    users/{uid}/locations:
      fields:
        - lat, lng, accuracy, timestamp, isSharing
      security: User can only read/write own location

## Firebase Configuration
firebase:
  project_id: emu-incidents
  region: us-central1
  services:
    firestore:
      mode: production
      rules: ./firestore.rules
      security: Role-based + per-user arrays
    
    hosting:
      public_directory: out
      rewrite: Single-page app (SPA)
      
    authentication:
      methods:
        - Email/Password (planned)
        - Anonymous (development only)
      
    storage:
      bucket: emu-incidents.appspot.com
      rules: Authenticated users only
      
    cloud_messaging:
      vapid_enabled: true
      service_worker: /firebase-messaging-sw.js

