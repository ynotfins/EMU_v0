  primary_endpoint:
    url: "https://us-central1-emu-incidents.cloudfunctions.net/ingress/webhook"
    authentication: "None required"
    method: "POST"
    content_type: "application/json"
    status: "Active"
    recommended_for: "MacroDroid webhook configuration"
    
  request_format:
    required_fields:
      - "message: string (required)"
    optional_fields:
      - "appName: string"
      - "title: string"
      - "ticker: string"
      - "subText: string"
      - "infoText: string"
      - "receivedAtEpoch: string (timestamp in milliseconds)"
