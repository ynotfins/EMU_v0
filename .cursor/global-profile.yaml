# MCP Server Profiles
# Detailed profiles of available MCP servers and their tools

mcp_profiles:
  github:
    name: "GitHub MCP Server"
    version: "latest"
    provider: "@modelcontextprotocol/server-github"
    tools_available: 26
    tools:
      - "create_repository"
      - "get_repository"
      - "list_repositories"
      - "create_branch"
      - "get_branch"
      - "list_branches"
      - "create_pull_request"
      - "get_pull_request"
      - "list_pull_requests"
      - "merge_pull_request"
      - "create_issue"
      - "get_issue"
      - "list_issues"
      - "update_issue"
      - "add_issue_comment"
      - "search_repositories"
      - "search_code"
      - "search_issues"
      - "get_file_contents"
      - "create_or_update_file"
      - "push_files"
      - "fork_repository"
      - "get_pull_request_files"
      - "get_pull_request_comments"
      - "get_pull_request_reviews"
      - "create_pull_request_review"
    capabilities:
      - "Repository management"
      - "Pull request operations"
      - "Issue tracking"
      - "Code search"
      - "File operations"
