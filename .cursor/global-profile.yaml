      - "firebase_login"
      - "firebase_logout"
      - "firebase_get_environment"
      - "firebase_update_environment"
      
      # Project Management
      - "firebase_get_project"
      - "firebase_list_projects"
      - "firebase_create_project"
      - "firebase_list_apps"
      - "firebase_get_sdk_config"
      - "firebase_create_app"
      - "firebase_create_android_sha"
      
      # Initialization
      - "firebase_init"
      
      # Firestore
      - "firestore_list_collections"
      - "firestore_get_documents"
      - "firestore_query_collection"
      - "firestore_delete_document"
      
      # Storage
      - "storage_get_object_download_url"
      
      # Authentication (Admin)
      - "auth_get_users"
      - "auth_update_user"
      - "auth_set_sms_region_policy"
      
      # Cloud Messaging
      - "messaging_send_message"
      
      # Cloud Functions
      - "functions_list_functions"
      - "functions_get_logs"
      
      # Remote Config
      - "remoteconfig_get_template"
      - "remoteconfig_update_template"
      
      # App Hosting
      - "apphosting_list_backends"
      - "apphosting_fetch_logs"
      
      # Realtime Database
      - "realtimedatabase_get_data"
      - "realtimedatabase_set_data"
      
      # Security Rules
      - "firebase_get_security_rules"
      - "firebase_validate_security_rules"
      
      # Resources
      - "firebase_read_resources"
      
      # Commands
      - "firebase:deploy"
      - "firebase:init"
      - "firebase:consult"
    
    resources:
      - "firebase://guides/init/backend"
      - "firebase://guides/init/ai"
      - "firebase://guides/init/firestore"
      - "firebase://guides/init/firestore_rules"
      - "firebase://guides/init/auth"
      - "firebase://guides/init/hosting"
    
    capabilities:
      - "Firestore operations"
      - "Realtime Database operations"
      - "Auth users/claims management"
      - "FCM push notifications"
      - "Security Rules validation"
      - "Cloud Functions logs"
      - "Remote Config management"
      - "Project/app management"
      - "Storage operations"
    
    use_cases:
      - "Schema discovery"
      - "Rules validation"
      - "Auth operations"
      - "FCM testing"
      - "Logs & debugging"
      - "SDK configuration"
    
    best_practices_alignment:
      - "Security hardening (rules validation)"
      - "Query optimization"
      - "Auth claims verification"
      - "Observability (logs)"
      - "SDK best practices"

  context7:
    name: "Context7 MCP Server"
    version: "latest"
    provider: "@upstash/context7-mcp"
    tools_available: 2
    tools:
      - tool: "resolve-library-id"
        description: "Resolves package/library name to Context7-compatible library ID"
        usage: "Get library ID before fetching docs"
        example: "resolve-library-id('firebase-admin')"
      
      - tool: "get-library-docs"
        description: "Fetches up-to-date documentation for a library"
        usage: "Get latest SDK patterns and best practices"
        example: "get-library-docs('/firebase/firebase-admin-node', topic: 'Firestore queries')"
    
    capabilities:
      - "Library documentation fetching"
      - "API documentation lookup"
      - "Latest version checking"
      - "Best practices guidance"
    
    use_cases:
      - "Fetching latest Firebase Admin SDK docs"
      - "Verifying SDK usage patterns"
      - "Finding best practices"
      - "Getting API references"
    
    best_practices_alignment:
      - "Using latest SDK patterns"
      - "Following official documentation"
      - "Best practices compliance"
      - "Up-to-date API usage"
    
    verified_tests:
      - test_date: "2025-01-05T04:30:00Z"
        tool: "resolve-library-id"
        input: "firebase-admin"
        output: "Multiple matches including /firebase/firebase-admin-node"
        status: "success"
      
      - test_date: "2025-01-05T04:30:00Z"
        tool: "get-library-docs"
        input: "/firebase/firebase-admin-node"
        topic: "Firestore query operations"
        output: "Complete documentation with code examples"
        status: "success"

